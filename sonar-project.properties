# SonarQube analysis of the whole monorepo (issue #70, Part 4 §1 and §3).
# The server URL and token come from CI secrets, never from this file.
sonar.projectKey=Projet-SIGL_plateforme-sigl
sonar.projectName=plateforme-sigl
sonar.sourceEncoding=UTF-8

# One module per microservice is declared by the workflow when services/ exists;
# sources are scanned from the folders of the layout in CONTRIBUTING.md.
sonar.sources=services,frontend/src
sonar.tests=services,frontend/src
sonar.test.inclusions=**/src/test/**,**/*.test.ts,**/*.test.tsx

# Coverage reports produced before the analysis (JaCoCo XML for Java, LCOV for React).
sonar.coverage.jacoco.xmlReportPaths=services/**/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Code that carries no business logic is excluded from coverage (Part 4 §1).
sonar.coverage.exclusions=**/dto/**,**/config/**,**/*Application.java,**/generated/**,**/*.d.ts,frontend/src/main.tsx,frontend/src/api/generated/**
