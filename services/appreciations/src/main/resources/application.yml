server:
  port: 8085

spring:
  application:
    name: appreciations
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

sigl:
  apprentices:
    base-url: ${APPRENTICES_BASE_URL}
  service-account:
    token-uri: ${KEYCLOAK_TOKEN_URI}
    client-id: ${SERVICE_ACCOUNT_CLIENT_ID}
    client-secret: ${SERVICE_ACCOUNT_CLIENT_SECRET}
